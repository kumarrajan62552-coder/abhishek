    <!-- Sound & Interactivity Script -->
    <script>
        const TELEGRAM_URL = "https://t.me/+uECO1q_eLqJiMmRl";
        const TOTAL_DURATION = 60; // 1 minute
        let secondsLeft = TOTAL_DURATION;

        // UI References
        const digitalClock = document.getElementById("digital-clock");
        const countdownSec = document.getElementById("countdown-sec");
        const timerBar = document.getElementById("timer-bar");
        const joinBtn = document.getElementById("join-btn");

        // SVG Radial Math
        const RADIUS = 54;
        const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

        // Audio Synth Context (Pure JS sound without external assets)
        let audioCtx = null;

        function playClickSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15); // A5
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        // Timer Display Formatter
        function formatClock(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // Update Timer Function
        function renderTimer() {
            digitalClock.textContent = formatClock(secondsLeft);
            countdownSec.textContent = secondsLeft;

            // Offset calculation
            const progress = secondsLeft / TOTAL_DURATION;
            const offset = CIRCUMFERENCE - (progress * CIRCUMFERENCE);
            timerBar.style.strokeDashoffset = offset;

            if (secondsLeft <= 0) {
                clearInterval(timerInterval);
                playClickSound();
                window.location.href = TELEGRAM_URL;
            } else {
                secondsLeft--;
            }
        }

        // Initialize Countdown
        renderTimer();
        const timerInterval = setInterval(renderTimer, 1000);

        // Click Handler
        joinBtn.addEventListener('click', function(e) {
            playClickSound();
        });

        // Interactive High-Performance Particle Engine
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let mouseX = -1000;
        let mouseY = -1000;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        function initParticles() {
            particles = [];
            const count = Math.min(Math.floor(window.innerWidth * 0.12), 110);
            
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.6,
                    vy: (Math.random() - 0.5) * 0.6,
                    radius: Math.random() * 2 + 0.5,
                    color: Math.random() > 0.5 ? '#00f2fe' : (Math.random() > 0.5 ? '#ff007f' : '#7928ca'),
                    alpha: Math.random() * 0.7 + 0.3
                });
            }
        }

        function renderParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];

                p.x += p.vx;
                p.y += p.vy;

                // Bounce off edges
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                // Draw Particle
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fill();

                // Draw Distance Connections
                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dx = p.x - p2.x;
                    let dy = p.y - p2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = p.color;
                        ctx.globalAlpha = (1 - dist / 100) * 0.25;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(renderParticles);
        }

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        renderParticles();
    </script>
